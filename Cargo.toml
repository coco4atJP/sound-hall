[workspace]
resolver = "2"
members = [
    "crates/sound-hall-core",
    "crates/sound-hall-wasm",
    "crates/sound-hall-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["SoundHall Contributors"]
description = "Lightweight zero-sample physical modeling & hybrid General MIDI synthesis engine"
repository = "https://github.com/coco4atJP/sound-hall"
homepage = "https://github.com/coco4atJP/sound-hall"
readme = "README.md"
keywords = ["audio", "synthesizer", "midi", "dsp", "physical-modeling"]
categories = ["multimedia::audio"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = true
panic = "abort"
